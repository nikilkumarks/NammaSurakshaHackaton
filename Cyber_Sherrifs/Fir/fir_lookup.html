<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FIR Lookup</title>
  <style>
    body {
      background-color: #2c3e50;
      color: white;
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    select, button {
      padding: 10px;
      font-size: 1rem;
      margin-top: 10px;
      border-radius: 5px;
      border: none;
      width: 100%;
    }

    select {
      background-color: #34495e;
      color: white;
    }

    button {
      background-color: #1abc9c;
      color: white;
      cursor: pointer;
    }

    .result {
      margin-top: 20px;
      background: #ecf0f1;
      color: #2c3e50;
      padding: 20px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>FIR Record Lookup</h1>
    <select id="firDropdown"></select>
    <button onclick="fetchFIR()">Get FIR Details</button>
    <div id="firResult" class="result"></div>
  </div>

  <script>
    const dropdown = document.getElementById('firDropdown');

    // Generate FIR IDs from 1 to 101
    for (let i = 1; i <= 101; i++) {
      const opt = document.createElement('option');
      opt.value = `${i}`;
      opt.text = `${i}`;
      dropdown.appendChild(opt);
    }

    function fetchFIR() {
      const code = dropdown.value;
      fetch(`get_fir.php?code=${code}`)
        .then(res => res.json())
        .then(data => {
          const resultDiv = document.getElementById('firResult');
          if (data.length > 0) {
            const fir = data[0];
            resultDiv.innerHTML = `
              <strong>Crime ID:</strong> ${fir.crime_id}<br>
              <strong>Crime Type:</strong> ${fir.crime_type}<br>
              <strong>Status:</strong> ${fir.crime_status}<br>
              <strong>No. of Casualties:</strong> ${fir.no_of_casualties}<br>
              <strong>Deceased:</strong> ${fir.deceased}<br>
              <strong>Suspects:</strong> ${fir.suspects}<br>
              <strong>Complaint:</strong> ${fir.complaint_in_brief}<br>
              <strong>Date:</strong> ${fir.created_at}
            `;
          } else {
            resultDiv.textContent = "No FIR data found for " + code;
          }
        })
        .catch(err => {
          console.error(err);
          document.getElementById('firResult').textContent = "Error fetching FIR data.";
        });
    }
  </script>
</body>
</html>
